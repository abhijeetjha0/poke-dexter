<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeDexter — The Ultimate Pokémon Information Hub</title>
  <meta name="description" content="PokeDexter is a feature-rich Pokémon information hub built with Next.js and React. Explore the Pokédex, moves, abilities, items, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 83, 80, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 80%, rgba(250, 204, 21, 0.06) 0%, transparent 60%);
      z-index: 0;
      animation: bgShift 12s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 640px;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Pokéball icon */
    .pokeball {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      position: relative;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff5350 50%, #fff 50%);
      border: 4px solid #333;
      box-shadow: 0 0 40px rgba(255, 83, 80, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    .pokeball::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: #333;
      transform: translateY(-50%);
    }

    .pokeball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      background: #fff;
      border: 4px solid #333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff5350, #facc15, #3b82f6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 1.1rem;
      color: #999;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .badges {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .badges img {
      height: 22px;
      transition: transform 0.2s ease;
    }

    .badges img:hover {
      transform: scale(1.08);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff5350, #e03e3c);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255, 83, 80, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(255, 83, 80, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      transition: all 0.25s ease;
    }

    .feature-card:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .feature-card .icon {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .feature-card .label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ccc;
    }

    footer {
      color: #555;
      font-size: 0.8rem;
      margin-top: 1rem;
    }

    footer a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #ff5350;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="pokeball" aria-hidden="true"></div>
    <h1>PokeDexter</h1>
    <p class="tagline">
      The ultimate Pokémon information hub. Explore 1,000+ species, moves, abilities, items, and build your dream team.
    </p>

    <div class="badges">
      <a href="./coverage/"><img src="./coverage/badge.svg" alt="Code Coverage"></a>
      <a href="https://github.com/abhijeetjha0/poke-dexter/blob/main/LICENSE"><img src="https://img.shields.io/badge/License-MIT-yellow.svg" alt="License: MIT"></a>
      <a href="https://poke-dexter-abhijeetjha0.vercel.app"><img src="https://img.shields.io/github/deployments/abhijeetjha0/poke-dexter/production?label=Vercel&logo=vercel" alt="Vercel Deployment"></a>
    </div>

    <div class="actions">
      <a href="https://poke-dexter-abhijeetjha0.vercel.app" class="btn btn-primary">🌐 Visit Live App</a>
      <a href="./coverage/" class="btn btn-secondary">📊 Coverage Report</a>
    </div>

    <div class="features">
      <div class="feature-card">
        <div class="icon">📖</div>
        <div class="label">Pokédex</div>
      </div>
      <div class="feature-card">
        <div class="icon">⚔️</div>
        <div class="label">Moves</div>
      </div>
      <div class="feature-card">
        <div class="icon">✨</div>
        <div class="label">Abilities</div>
      </div>
      <div class="feature-card">
        <div class="icon">🎒</div>
        <div class="label">Items</div>
      </div>
      <div class="feature-card">
        <div class="icon">🛡️</div>
        <div class="label">Types</div>
      </div>
      <div class="feature-card">
        <div class="icon">👥</div>
        <div class="label">Team Builder</div>
      </div>
    </div>

    <footer>
      Built by <a href="https://github.com/abhijeetjha0">Abhijit Kumar Jha</a> &amp; <a href="https://github.com/kanishktanwar">Kanishk Tanwar</a>
      · <a href="https://github.com/abhijeetjha0/poke-dexter">GitHub</a>
    </footer>
  </div>
</body>
</html>
