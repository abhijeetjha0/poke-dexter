<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff5350">
    <title>Offline | PokeDexter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0a0a1a;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            text-align: center;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 72px;
            height: 72px;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }
        .btn-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-primary {
            background: #ef4444;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="#ffffff" stroke="#374151" stroke-width="6" />
            <path d="M 4 50 A 46 46 0 0 1 96 50 Z" fill="#ef4444" stroke="#374151" stroke-width="6" />
            <line x1="4" y1="50" x2="96" y2="50" stroke="#374151" stroke-width="8" />
            <circle cx="50" cy="50" r="16" fill="#374151" />
            <circle cx="50" cy="50" r="10" fill="#ffffff" />
            <circle cx="50" cy="50" r="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" />
        </svg>
        <h1>You are Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, any Pokémon profiles and pages you've previously browsed are still cached and ready to explore!</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
            <a href="/" class="btn btn-secondary">Go to Home</a>
        </div>
    </div>
</body>
</html>
